# nginx in front of voiceannotate: HTTPS outside, plain HTTP to the container.
#
# Copy to /etc/nginx/conf.d/ (or sites-available/ + a link in sites-enabled/),
# replace the server name and the certificate paths, then:
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# The certificate paths are the ones certbot writes; with Let's Encrypt,
#     sudo certbot certonly --nginx -d voiceannotate.example.com
# obtains them.
#
# Three settings below are not decoration -- without each of them something
# in the application stops working:
#   client_max_body_size   nginx refuses anything over 1 MB by default, which
#                          is every audio file worth transcribing;
#   proxy_buffering off    progress is streamed, and a buffered stream arrives
#                          in one piece when the transcription is over;
#   proxy_read_timeout     a queued job's stream can be quiet for a while.

upstream voiceannotate {
    # The container, published on the host by docker-compose.yml. With nginx
    # in front, publish it on the loopback only, so nobody can go around it:
    #     ports: ["127.0.0.1:8000:8000"]
    server 127.0.0.1:9005;
    keepalive 16;
}

# Plain HTTP only redirects. Certbot's renewal challenge is answered first, so
# a renewal still works with the redirect in place.
server {
    listen 80;
    listen [::]:80;
    server_name voiceannotate.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 9007 ssl;
    listen [::]:9007 ssl;
    http2 on;
    server_name zorgul.com;

    ssl_certificate      private/zorgul.pem;
    ssl_certificate_key  private/zorgul.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:voiceannotate_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # The largest file the application accepts is VA_MAX_UPLOAD_MB (512 by
    # default); keep the two in step, a little above it here so that it is the
    # application that answers, with a message the page can show.
    client_max_body_size 520m;
    # Uploads are passed on as they arrive rather than written to a temporary
    # file first: the application checks the size and the per-user limit
    # itself, and a refused upload should stop early.
    proxy_request_buffering off;
    client_body_timeout 300s;

    location / {
        proxy_pass http://voiceannotate;
        proxy_http_version 1.1;
        # Empty, so the connection to the container can be kept alive and
        # reused (see keepalive above).
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 300s;
    }

    # The progress of a transcription: one long response that must reach the
    # browser as it is written. The application already sends
    # "X-Accel-Buffering: no"; this says it again, so the stream still works
    # if something between the two strips that header. The server sends a
    # keepalive every 15 seconds, well inside the timeout.
    location ~ ^/api/jobs/[0-9a-f]+/events$ {
        proxy_pass http://voiceannotate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
